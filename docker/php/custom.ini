; Konfigurasi PHP untuk produksi KampusLMS (disalin ke conf.d oleh Dockerfile).

; Batas unggah server harus >= batas validasi Laravel (materi 20 MB / submission 5 MB).
; Kalau lebih kecil, berkas ditolak PHP sebelum Laravel sempat memvalidasi (Modul Minggu 9).
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 256M

; Jangan umumkan versi PHP lewat header X-Powered-By.
expose_php = Off
